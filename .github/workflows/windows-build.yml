name: Windows Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Windows x64 (MSVC 2022, Qt 6.8.3)
    runs-on: windows-2022

    env:
      QT_VERSION: 6.8.3
      QT_KIT: win64_msvc2022_64
      QT_INSTALL_DIR: ${{ github.workspace }}\Qt
      BUILD_TYPE: Release
      BUILD_DIR: ${{ github.workspace }}\build
      OUTPUT_DIR: ${{ github.workspace }}\build\bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up Python (for aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: python -m pip install --upgrade pip aqtinstall

      - name: Install Qt ${{ env.QT_VERSION }} (${{ env.QT_KIT }})
        shell: pwsh
        run: |
          # qtbase           : Core, Gui, Widgets, CMake configs, moc/rcc/uic
          # qtdeclarative    : Qml, Quick, Quick Controls 2, Quick Layouts
          # qtshadertools    : runtime shader compiler required by QtQuick
          # qttools          : windeployqt
          aqt install-qt `
            --outputdir "${{ env.QT_INSTALL_DIR }}" `
            windows desktop ${{ env.QT_VERSION }} ${{ env.QT_KIT }} `
            -m qtbase qtdeclarative qtshadertools qttools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate Qt installation and expose to PATH
        id: qt
        shell: pwsh
        run: |
          $qtDir = "${{ env.QT_INSTALL_DIR }}\${{ env.QT_VERSION }}\${{ env.QT_KIT }}"
          $qtBin = "$qtDir\bin"
          if (!(Test-Path "$qtBin\qmake.exe")) {
            Write-Error "qmake.exe not found at $qtBin -- Qt installation may have failed."
            exit 1
          }
          echo "qtDir=$qtDir"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "qtBin=$qtBin"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # Prepend qtBin to PATH for subsequent steps (tests, windeployqt call site)
          echo "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure CMake (Ninja, C++20, Release)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qtDir }}" `
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ env.OUTPUT_DIR }}" `
            -DKOMAPAINT_BUILD_TESTS=ON `
            -DKOMAPAINT_ENABLE_WARNINGS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the executable exists
        shell: pwsh
        run: |
          $exe = "${{ env.OUTPUT_DIR }}\komapaint.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Expected build output not found: $exe"
            exit 1
          }
          Write-Host "Built executable:"
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Run unit tests (CTest)
        shell: pwsh
        run: |
          # The Qt DLLs directory is already on PATH from the qt Locate step.
          ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt runtime dependencies (windeployqt)
        shell: pwsh
        run: |
          $windeploy = "${{ steps.qt.outputs.qtBin }}\windeployqt.exe"
          $exe       = "${{ env.OUTPUT_DIR }}\komapaint.exe"
          $qmlDir    = "${{ github.workspace }}\ui"
          & $windeploy --release --no-compiler-runtime --no-system-d3d-compiler `
            --no-opengl-sw --qmldir $qmlDir $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sanity-check deployed tree
        shell: pwsh
        run: |
          $bin = "${{ env.OUTPUT_DIR }}"
          $required = @(
            "$bin\komapaint.exe",
            "$bin\Qt6Core.dll",
            "$bin\Qt6Gui.dll",
            "$bin\Qt6Qml.dll",
            "$bin\Qt6Quick.dll",
            "$bin\Qt6QuickControls2.dll",
            "$bin\Qt6Widgets.dll",
            "$bin\platforms\qwindows.dll"
          )
          foreach ($f in $required) {
            if (!(Test-Path $f)) {
              Write-Error "Missing required deployed file: $f"
              exit 1
            }
          }
          Write-Host "--- Deployed files (top-level):"
          Get-ChildItem $bin -File | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Package into ZIP
        shell: pwsh
        run: |
          $src = "${{ env.OUTPUT_DIR }}"
          $zip = "${{ github.workspace }}\KomaPaint-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) {
            Write-Error "Packaging failed; zip not produced."
            exit 1
          }
          Get-Item $zip | Format-List Name,Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomaPaint-Windows-x64-Qt${{ env.QT_VERSION }}
          path: KomaPaint-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
