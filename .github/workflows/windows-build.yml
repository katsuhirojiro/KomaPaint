name: Windows Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Windows x64 (MSVC 2022, Qt 6.8.3)
    runs-on: windows-2022

    env:
      QT_VERSION: 6.8.3
      QT_ARCH: win64_msvc2022_64
      QT_INSTALL_DIR: ${{ github.workspace }}\qt
      BUILD_TYPE: Release
      BUILD_DIR: ${{ github.workspace }}\build
      OUTPUT_DIR: ${{ github.workspace }}\build\bin
      TEST_DIR: ${{ github.workspace }}\build\tests\bin
      STAGE_DIR: ${{ github.workspace }}\dist\KomaPaint

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up Python (for aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.0" "py7zr==1.1.0"

      - name: Install Qt ${{ env.QT_VERSION }} (${{ env.QT_ARCH }})
        shell: pwsh
        run: |
          # Qt for Windows desktop ships qtdeclarative, qttools, qtshadertools etc.
          # as *archives* (top-level .7z packages), not as `-m` addon modules.
          # Using --archives with no base "all" subset does the full install minus
          # the archives we omit; we only pull what KomaPaint actually uses so the
          # job stays fast.
          aqt install-qt --outputdir "${{ env.QT_INSTALL_DIR }}" `
            windows desktop ${{ env.QT_VERSION }} ${{ env.QT_ARCH }} `
            --archives qtbase qtdeclarative qtquickcontrols2 qtshadertools qttools `
                       icu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate Qt installation
        id: qt
        shell: pwsh
        run: |
          # aqt places the install at <outputdir>/<version>/<arch>.
          # In case the directory layout differs from what we expect, search for qmake.
          $qtInstallRoot = "${{ env.QT_INSTALL_DIR }}"
          Write-Host "--- Contents of $qtInstallRoot (recursive, top 2 levels):"
          Get-ChildItem $qtInstallRoot -Depth 2 -ErrorAction SilentlyContinue | Select FullName | Out-String | Write-Host
          $qmake = Get-ChildItem $qtInstallRoot -Recurse -Filter qmake.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $qmake) {
            Write-Error "qmake.exe not found anywhere under $qtInstallRoot -- Qt installation failed."
            exit 1
          }
          $qtBin = Split-Path $qmake.FullName -Parent
          $qtDir = Split-Path $qtBin -Parent
          Write-Host "Qt root : $qtDir"
          Write-Host "Qt bin  : $qtBin"
          echo "qtDir=$qtDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "qtBin=$qtBin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # Expose Qt DLLs on PATH so test executables can find them.
          echo "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure CMake (Ninja, C++20, Release)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qtDir }}" `
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ env.OUTPUT_DIR }}" `
            -DKOMAPAINT_BUILD_TESTS=ON `
            -DKOMAPAINT_BUILD_BENCHMARKS=ON `
            -DKOMAPAINT_ENABLE_WARNINGS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $buildLog = & cmake --build build --config ${{ env.BUILD_TYPE }} --verbose 2>&1 | Out-String
          $buildExit = $LASTEXITCODE
          Write-Host $buildLog
          if ($buildExit -ne 0) {
            $errors = ($buildLog -split "`n" | Where-Object { $_ -match '(error C[0-9]+|fatal error|error:|FAILED:)' }) -join "`n"
            if (!$errors) { $errors = $buildLog }
            $escaped = $errors.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Build diagnostics::$escaped"
            exit $buildExit
          }

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "${{ env.OUTPUT_DIR }}\KomaPaint.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Expected build output not found: $exe"
            Write-Host "Files in build\bin:"
            Get-ChildItem ${{ env.OUTPUT_DIR }} -File -ErrorAction SilentlyContinue | Select Name | Out-String | Write-Host
            exit 1
          }
          Write-Host "Built executable:"
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Write-Host ""
          Write-Host "Test executables (must be OUTSIDE build\bin so they are not shipped):"
          $testExes = Get-ChildItem "${{ env.TEST_DIR }}" -Filter "test_*.exe" -ErrorAction SilentlyContinue
          $testExes | ForEach-Object { Write-Host ("  " + $_.FullName) }
          $strayTests = Get-ChildItem "${{ env.OUTPUT_DIR }}" -Filter "test_*.exe" -ErrorAction SilentlyContinue
          if ($strayTests) {
            Write-Error "Test executables leaked into the app output directory:"
            $strayTests | ForEach-Object { Write-Host ("  " + $_.FullName) }
            exit 1
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.qt.outputs.qtBin }};${{ env.TEST_DIR }};" + $env:PATH
          $env:QT_QPA_PLATFORM = "offscreen"
          # These interfaces deliberately customize Controls 2 primitives;
          # the Basic style supports that consistently on the Windows runner.
          $env:QT_QUICK_CONTROLS_STYLE = "Basic"
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = 0
          $totals = @()
          $exes = Get-ChildItem "${{ env.TEST_DIR }}" -Filter "test_*.exe" | Sort-Object Name
          if ($exes.Count -eq 0) {
            Write-Error "No test executables were produced in ${{ env.TEST_DIR }}"
            exit 1
          }
          Write-Host "=== Discovered $($exes.Count) test executable(s) in ${{ env.TEST_DIR }} ==="
          foreach ($exe in $exes) {
            Write-Host ">>> Running $($exe.Name) <<<"
            # -o writes the QTest log to a file directly; it survives even when
            # the process crashes and stdout is lost.
            $resultFile = Join-Path $env:RUNNER_TEMP ($exe.BaseName + '.txt')
            $output = & $exe.FullName -o "$resultFile,txt" 2>&1 | Out-String
            $code = $LASTEXITCODE
            if (Test-Path $resultFile) { $output += "`n" + (Get-Content $resultFile -Raw) }
            Write-Host $output
            $totalsLine = ($output -split "`n" | Where-Object { $_ -match '^Totals: ' } | Select-Object -Last 1)
            if ($totalsLine) { $totals += ("$($exe.BaseName): " + $totalsLine.Trim()) }
            if ($code -ne 0) {
              Write-Host ">>> $($exe.Name) FAILED with exit code $code <<<"
              $failed++
              # Preserve actual assertion failures in the annotation rather than
              # the last QML warnings, so CI failures remain diagnosable when raw
              # Actions logs cannot be downloaded from this environment.
              $diagnostics = @($output -split "`n" | Where-Object {
                $_ -match '^(FAIL!|QFATAL|   Actual|   Expected|   Loc:|.*failure location|Totals:)'
              })
              if ($diagnostics.Count -gt 0) { $annotation = $diagnostics -join ' || ' }
              else { $annotation = $output }
              $annotation = $annotation.Replace('%', '%25').Replace("`r", ' ').Replace("`n", ' || ')
              if ($annotation.Length -gt 1800) { $annotation = "...(truncated) " + $annotation.Substring($annotation.Length - 1800) }
              # Emit one compact check annotation per failing executable. A
              # single aggregate annotation is truncated by GitHub at 4 KiB,
              # which can hide the first failures and make CI impossible to
              # diagnose when the raw Actions log archive is unavailable.
              Write-Host "::error title=$($exe.Name) failed (exit $code)::$annotation"
            } else {
              Write-Host ">>> $($exe.Name) PASSED (exit $code) <<<"
            }
            Write-Host ""
          }
          if ($failed -gt 0) {
            Write-Host "=== $failed test(s) FAILED ==="
            Write-Host "::error title=Unit tests failed ($failed)::See the per-executable failure annotations above."
            exit 1
          }
          Write-Host "=== All tests passed ==="
          # Single-line annotation with the per-executable totals. Artifact and
          # raw logs are not always retrievable (blob storage), but annotations
          # are, so the test result stays verifiable from the run itself.
          $totals = @($totals)
          $totalsLine = if ($totals.Count -gt 0) { $totals -join ' ; ' } else { 'no Totals lines' }
          if ($totalsLine.Length -gt 8000) { $totalsLine = $totalsLine.Substring(0, 8000) + ' ...' }
          Write-Host "::notice title=Unit test totals::$($exes.Count) test executables; $totalsLine"

      - name: Run workload benchmarks (smoke)
        shell: pwsh
        run: |
          # The benchmarks are not assertions: shared runners are too noisy for
          # timing thresholds. Running them here proves the harnesses still
          # link, run and exercise the real code paths, and prints a shape of
          # the current numbers into the log for comparison with
          # bench/README.md.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $benchDir = Join-Path $PWD "build/bench/bin"
          $exes = Get-ChildItem $benchDir -Filter "bench_*.exe" | Sort-Object Name
          if ($exes.Count -eq 0) {
            Write-Host "::error title=Benchmarks missing::No bench_*.exe in $benchDir"
            exit 1
          }
          $failed = 0
          $summary = @()
          foreach ($exe in $exes) {
            Write-Host ">>> $($exe.Name) <<<"
            $output = & $exe.FullName 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $output
            if ($code -ne 0) {
              $note = ($output -split "`n" | Select-Object -Last 6) -join ' || '
              $note = $note.Replace('%', '%25').Replace("`r", ' ').Replace("`n", ' || ')
              Write-Host "::error title=$($exe.Name) failed (exit $code)::$note"
              $failed++
            } else {
              $rows = @($output -split "`n" | Where-Object { $_.Trim().Length -gt 0 } |
                        Select-Object -Last 8 | ForEach-Object { $_.Trim() })
              $summary += ("[" + $exe.BaseName + "] " + ($rows -join ' | '))
            }
          }
          # The run log archive is not always retrievable, but annotations are,
          # so the Windows Release numbers are published as one annotation.
          # A single annotation is capped at 4 KiB by GitHub, so trim.
          $summaryLine = ($summary -join "`n")
          $summaryLine = $summaryLine.Replace('%', '%25').Replace("`r", ' ').Replace("`n", ' || ')
          if ($summaryLine.Length -gt 3800) { $summaryLine = $summaryLine.Substring(0, 3800) + ' ...' }
          Write-Host "::notice title=Workload benchmarks (MSVC Release)::$summaryLine"
          if ($failed -gt 0) { exit 1 }
          Write-Host "=== All benchmarks ran ==="

      - name: Stage application directory
        shell: pwsh
        run: |
          # Start from a clean staging directory containing only KomaPaint.exe.
          # Do NOT pre-create qt.conf: windeployqt writes its own qt.conf into
          # --dir pointing Plugins/Qml2Imports at the relative subdirectories it
          # creates; overwriting it with "Plugins=." can break plugin lookup.
          if (Test-Path "${{ env.STAGE_DIR }}") { Remove-Item "${{ env.STAGE_DIR }}" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "${{ env.STAGE_DIR }}" | Out-Null
          Copy-Item "${{ env.OUTPUT_DIR }}\KomaPaint.exe" "${{ env.STAGE_DIR }}\KomaPaint.exe" -Force
          Write-Host "Staged KomaPaint.exe into ${{ env.STAGE_DIR }}"

      - name: Deploy Qt and MSVC runtime dependencies (windeployqt)
        shell: pwsh
        run: |
          $windeploy = Join-Path "${{ steps.qt.outputs.qtBin }}" "windeployqt.exe"
          if (!(Test-Path $windeploy)) {
            Write-Error "windeployqt.exe not found at $windeploy"
            exit 1
          }
          $exe    = "${{ env.STAGE_DIR }}\KomaPaint.exe"
          $qmlDir = "${{ github.workspace }}\ui"
          Push-Location "${{ env.STAGE_DIR }}"
          & $windeploy --release --no-system-d3d-compiler `
            --no-opengl-sw --qmldir $qmlDir --dir . $exe
          $deployExit = $LASTEXITCODE
          Pop-Location
          if ($deployExit -ne 0) { exit $deployExit }

          # Ensure offscreen platform plugin is present for headless smoke/CI checks.
          $pluginsRoot = (Resolve-Path "${{ steps.qt.outputs.qtBin }}\..\plugins").Path
          $offSrc = Join-Path $pluginsRoot "platforms\qoffscreen.dll"
          $offDst = "${{ env.STAGE_DIR }}\platforms\qoffscreen.dll"
          if (Test-Path $offSrc) {
            Copy-Item $offSrc $offDst -Force
            Write-Host "Copied qoffscreen.dll -> $offDst"
          } else {
            Write-Error "qoffscreen.dll not found at $offSrc"
            exit 1
          }

          # Bundle MSVC CRT DLLs (vcruntime140*, msvcp140*) so the ZIP runs
          # on clean Windows machines without Visual Studio or VC++ Redist.
          $crtCopied = @()
          if ($env:VCToolsRedistDir -and (Test-Path $env:VCToolsRedistDir)) {
            $crtDir = Get-ChildItem (Join-Path $env:VCToolsRedistDir "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($crtDir) {
              foreach ($dllName in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_atomic_wait.dll", "concrt140.dll")) {
                $srcDll = Join-Path $crtDir.FullName $dllName
                $dstDll = Join-Path "${{ env.STAGE_DIR }}" $dllName
                if ((Test-Path $srcDll) -and !(Test-Path $dstDll)) {
                  Copy-Item $srcDll $dstDll -Force
                  $crtCopied += $dllName
                }
              }
            }
          }
          # Remove vc_redist installer exe if windeployqt copied it (we ship the CRT DLLs directly).
          $redistExe = Join-Path "${{ env.STAGE_DIR }}" "vc_redist.x64.exe"
          if (Test-Path $redistExe) { Remove-Item $redistExe -Force }
          Write-Host "Bundled MSVC CRT DLLs: $($crtCopied -join ', ')"

      - name: Verify no test-only DLLs leaked into the package
        shell: pwsh
        run: |
          $stage = "${{ env.STAGE_DIR }}"
          $forbidden = @(
            "Qt6Test.dll",
            "Qt6Test.pdb"
          )
          foreach ($f in $forbidden) {
            $found = Get-ChildItem $stage -Recurse -Filter $f -ErrorAction SilentlyContinue
            if ($found) {
              Write-Error "Test-only file leaked into release package: $($found.FullName)"
              exit 1
            }
          }
          $testExes = Get-ChildItem $stage -Recurse -Filter "test_*.exe" -ErrorAction SilentlyContinue
          if ($testExes) {
            Write-Error "Test executables leaked into release package:"
            $testExes | ForEach-Object { Write-Host ("  " + $_.FullName) }
            exit 1
          }
          Write-Host "Package is clean: no Qt6Test.dll, no test_*.exe."

      - name: Sanity-check deployed tree
        shell: pwsh
        run: |
          $bin = "${{ env.STAGE_DIR }}"
          $required = @(
            "$bin\KomaPaint.exe",
            "$bin\Qt6Core.dll",
            "$bin\Qt6Gui.dll",
            "$bin\Qt6Qml.dll",
            "$bin\Qt6Quick.dll",
            "$bin\Qt6QuickControls2.dll",
            "$bin\Qt6Widgets.dll",
            "$bin\vcruntime140.dll",
            "$bin\msvcp140.dll",
            "$bin\platforms\qwindows.dll",
            "$bin\platforms\qoffscreen.dll"
          )
          foreach ($f in $required) {
            if (!(Test-Path $f)) {
              Write-Error "Missing required deployed file: $f"
              Write-Host "Deployed DLLs:"
              Get-ChildItem $bin -File -Filter "*.dll" | Select Name | Format-Table -AutoSize | Out-String | Write-Host
              exit 1
            }
          }
          Write-Host "--- Deployed files (top-level):"
          Get-ChildItem $bin -File | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Package into ZIP
        shell: pwsh
        run: |
          Copy-Item "${{ github.workspace }}\packaging\Register_koma_file_association.cmd" "${{ env.STAGE_DIR }}\Register_koma_file_association.cmd" -Force
          $zip = "${{ github.workspace }}\KomaPaint-Windows-x64-Human-Test.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "${{ env.STAGE_DIR }}" -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) {
            Write-Error "Packaging failed; zip not produced."
            exit 1
          }
          Get-Item $zip | Format-List Name,Length
          $files = @(Get-ChildItem "${{ env.STAGE_DIR }}" -Recurse -File)
          $dlls = @($files | Where-Object { $_.Extension -eq '.dll' })
          $qmlFiles = @($files | Where-Object { $_.FullName -match '\\qml\\' })
          $topLevel = @($files | Where-Object { $_.DirectoryName -eq "${{ env.STAGE_DIR }}" })
          $inventory = "$($files.Count) files total; top level: " + (($topLevel | Sort-Object Name | ForEach-Object { $_.Name }) -join ', ')
          if ($inventory.Length -gt 1400) { $inventory = $inventory.Substring(0, 1400) + ' ...' }
          $hasExe = Test-Path (Join-Path "${{ env.STAGE_DIR }}" 'KomaPaint.exe')
          $hasQWindows = Test-Path (Join-Path "${{ env.STAGE_DIR }}" 'platforms\qwindows.dll')
          $zipBytes = (Get-Item $zip).Length
          Write-Host "::notice title=Release package inventory::zip $zipBytes bytes ($([math]::Round($zipBytes / 1MB, 1)) MB); KomaPaint.exe=$hasExe; DLLs=$($dlls.Count); QML files=$($qmlFiles.Count); qwindows.dll=$hasQWindows; $inventory"

      - name: Verify extracted packaged application (launch + end-to-end GUI checks)
        shell: pwsh
        run: |
          # Extract into a clean directory isolated from Qt SDK and build output.
          $extract = Join-Path $env:RUNNER_TEMP 'komapaint-zip-smoke'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path "${{ github.workspace }}\KomaPaint-Windows-x64-Human-Test.zip" -DestinationPath $extract
          $bin = Join-Path $extract 'KomaPaint'
          $env:PATH = "$bin;$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QT_QPA_PLATFORM_PLUGIN_PATH, Env:QML_IMPORT_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "windows"
          $exe = "$bin\KomaPaint.exe"
          $env:KOMAPAINT_SMOKE_LOG = Join-Path $env:RUNNER_TEMP "komapaint-smoke.log"
          Remove-Item $env:KOMAPAINT_SMOKE_LOG -ErrorAction SilentlyContinue

          # Isolate user AppData so verification writes clean session/recovery/project data
          $isolatedAppData = Join-Path $env:RUNNER_TEMP 'komapaint-verify-appdata'
          if (Test-Path $isolatedAppData) { Remove-Item $isolatedAppData -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $isolatedAppData | Out-Null
          $env:APPDATA = $isolatedAppData
          $env:LOCALAPPDATA = $isolatedAppData

          Write-Host "============================================"
          Write-Host "PACKAGED VERIFICATION: launching KomaPaint.exe directly"
          Write-Host "  exe:       $exe"
          Write-Host "  cwd:       $bin"
          Write-Host "  QT_QPA_PLATFORM=$env:QT_QPA_PLATFORM"
          Write-Host "============================================"

          # Diagnostics: list files the app actually needs
          # Verify the packaged binary really is a Windows GUI-subsystem
          # executable (PE subsystem 2), not a Windows console executable
          # (subsystem 3). The subsystem is what decides whether Windows
          # allocates a separate console/terminal window at launch time.
          function Get-PeSubsystem {
            param([Parameter(Mandatory = $true)][string]$Path)
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              try {
                $stream.Position = 0x3c
                $peOffset = $reader.ReadInt32()
                $stream.Position = $peOffset
                if ($reader.ReadUInt32() -ne 0x00004550) {
                  throw "Invalid PE signature in $Path"
                }
                # PE signature (4 bytes) + COFF header (20 bytes), then the
                # Subsystem UInt16 at offset 68 in the optional header.
                $stream.Position = $peOffset + 4 + 20 + 68
                return $reader.ReadUInt16()
              } finally {
                $reader.Dispose()
              }
            } finally {
              $stream.Dispose()
            }
          }
          function Fail-Smoke {
            param([string]$Message)
            # Emit a compact single-line annotation so the failure is visible
            # via the checks API (logs are not always retrievable).
            $m = $Message.Replace('%','%25').Replace("`r",' ').Replace("`n",' || ')
            if ($m.Length -gt 1500) { $m = "...(truncated) " + $m.Substring($m.Length - 1500) }
            Write-Host "::error title=Smoke test failed::$m"
            exit 1
          }
          $peSubsystem = Get-PeSubsystem $exe
          $peSubsystemName = switch ($peSubsystem) {
            2 { "Windows GUI" }
            3 { "Windows Console" }
            default { "Unknown" }
          }
          Write-Host "[DIAG] komapaint.exe PE subsystem: $peSubsystem ($peSubsystemName)"
          if ($peSubsystem -ne 2) {
            Fail-Smoke "komapaint.exe must use the Windows GUI subsystem (2), got $peSubsystem ($peSubsystemName)."
          }

          Write-Host ""
          Write-Host "[DIAG] komapaint.exe exists: $(Test-Path $exe)"
          Write-Host "[DIAG] Qt6Core.dll in stage:  $(Test-Path "$bin\Qt6Core.dll")"
          Write-Host "[DIAG] Qt6Gui.dll in stage:   $(Test-Path "$bin\Qt6Gui.dll")"
          Write-Host "[DIAG] Qt6Qml.dll in stage:   $(Test-Path "$bin\Qt6Qml.dll")"
          Write-Host "[DIAG] Qt6Quick.dll in stage: $(Test-Path "$bin\Qt6Quick.dll")"
          Write-Host "[DIAG] qwindows.dll:          $(Test-Path "$bin\platforms\qwindows.dll")"
          Write-Host "[DIAG] qoffscreen.dll:        $(Test-Path "$bin\platforms\qoffscreen.dll")"
          Write-Host "[DIAG] qt.conf:               $(Test-Path "$bin\qt.conf")"
          if (Test-Path "$bin\qt.conf") {
            Write-Host "--- qt.conf contents ---"
            Get-Content "$bin\qt.conf" | ForEach-Object { Write-Host "  $_" }
          }
          Write-Host ""

          # Launch without output redirection and without -NoNewWindow. The
          # executable uses the Windows GUI subsystem (verified above), so
          # Windows does not allocate a separate terminal/console window for
          # it. Its development diagnostics are routed through Qt logging to
          # the Windows debugger output channel instead of stdout/stderr, so
          # this smoke test verifies launch behaviour from the process and
          # native window state rather than captured console text.
          Write-Host ">>> STARTING komapaint.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory $bin -PassThru
          Write-Host ">>> Started PID $($p.Id) at $(Get-Date -Format o)"

          # A process that exits within 5 seconds crashed on start-up; one that
          # is still alive has a running event loop. The main window is waited
          # for separately, below, because a shared runner can be slow to show
          # it.
          $deadline = (Get-Date).AddSeconds(5)
          $exitedEarly = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited) {
              Write-Host ">>> PROCESS EXITED EARLY with code $($p.ExitCode) at $(Get-Date -Format o)"
              $exitedEarly = $true
              break
            }
          }

          if (-not $exitedEarly) {
            Write-Host ">>> Process alive after 5s - event loop is running."

            # Prove that the packaged process created its actual native main
            # window, rather than merely keeping a process alive. A shared
            # runner can be slow to put the window on screen (cold file cache,
            # virus scanning, first paint), so wait generously instead of
            # asserting a five-second limit: a build that never shows a window
            # still fails, and how long it took is recorded either way.
            $windowWait = [System.Diagnostics.Stopwatch]::StartNew()
            while ($windowWait.Elapsed.TotalSeconds -lt 45) {
              $p.Refresh()
              if ($p.HasExited) { break }
              if ($p.MainWindowHandle -ne [IntPtr]::Zero) { break }
              Start-Sleep -Milliseconds 250
            }
            $p.Refresh()
            $mainWindowHandle = $p.MainWindowHandle
            $mainWindowTitle = $p.MainWindowTitle
            $windowSeconds = [math]::Round($windowWait.Elapsed.TotalSeconds, 1)
            Write-Host ">>> MainWindowHandle: $mainWindowHandle (after $windowSeconds s)"
            Write-Host ">>> MainWindowTitle:  '$mainWindowTitle'"
            if ($mainWindowHandle -eq [IntPtr]::Zero) {
              if (-not $p.HasExited) { $p.Kill(); $p.WaitForExit() }
              $diag = if (Test-Path $env:KOMAPAINT_SMOKE_LOG) { Get-Content $env:KOMAPAINT_SMOKE_LOG -Raw } else { 'no Qt startup log' }
              # Keep the observation and initialization milestones in separate
              # annotations: Fail-Smoke truncates long messages to 1500 chars.
              $milestones = if (Test-Path $env:KOMAPAINT_SMOKE_LOG) {
                (Get-Content $env:KOMAPAINT_SMOKE_LOG | Where-Object { $_ -match 'main\(\): entry|Constructing QApplication|QApplication constructed|calling m_engine.load|m_engine.load\(\) returned|main window created|entering app.exec' }) -join ' || '
              } else { 'no Qt startup milestones' }
              if ($milestones.Length -gt 1200) { $milestones = $milestones.Substring(0, 1200) }
              Write-Host "::notice title=Smoke startup milestones::$milestones"
              if ($diag.Length -gt 700) { $diag = $diag.Substring($diag.Length - 700) }
              Fail-Smoke "no native main-window handle after $windowSeconds s (title: '$mainWindowTitle'); startup log tail: $diag"
            }
            if ($mainWindowTitle -notlike "KomaPaint *") {
              $p.Kill()
              $p.WaitForExit()
              Fail-Smoke "unexpected main-window title '$mainWindowTitle'."
            }

            $closeAccepted = $p.CloseMainWindow()
            Write-Host ">>> CloseMainWindow accepted: $closeAccepted"
            if (-not $closeAccepted) {
              $p.Kill()
              $p.WaitForExit()
              Fail-Smoke "CloseMainWindow could not deliver WM_CLOSE (handle: $mainWindowHandle, title: '$mainWindowTitle')."
            }
            if (-not $p.WaitForExit(5000)) {
              $p.Kill()
              $p.WaitForExit()
              Fail-Smoke "process did not exit within 5s after WM_CLOSE (handle: $mainWindowHandle, title: '$mainWindowTitle', closeAccepted: $closeAccepted)."
            }
            Write-Host ">>> Process exited with code $($p.ExitCode) after close."
            if ($p.ExitCode -ne 0) {
              Fail-Smoke "process exited with non-zero code $($p.ExitCode) after WM_CLOSE."
            }
            Write-Host "=== Smoke test PASSED ==="
            Write-Host "::notice title=Packaged smoke test::extracted ZIP launched from a clean PATH with no Qt on it; native window '$mainWindowTitle' appeared after $windowSeconds s; PE subsystem $peSubsystem (Windows GUI); closed with WM_CLOSE; exit code 0"
          } else {
            Fail-Smoke "KomaPaint.exe exited prematurely with code $($p.ExitCode) (expected the event loop to run; check for a startup crash or a QML load failure)."
          }

          # Now run the 8-point packaged functional verification inside the extracted KomaPaint.exe itself
          $verifyReport = Join-Path $env:RUNNER_TEMP "komapaint-verify-report.txt"
          Remove-Item $verifyReport -ErrorAction SilentlyContinue
          $env:KOMAPAINT_VERIFY_PACKAGED = "1"
          $env:KOMAPAINT_VERIFY_REPORT = $verifyReport
          $vp = Start-Process -FilePath $exe -WorkingDirectory $bin -PassThru
          if (-not $vp.WaitForExit(60000)) {
            $vp.Kill()
            $vp.WaitForExit()
            Fail-Smoke "Packaged functional verification timed out after 60s."
          }
          $reportText = if (Test-Path $verifyReport) { (Get-Content $verifyReport -Raw).Trim() } else { "no report written" }
          Write-Host "--- Packaged functional verification report ---"
          Write-Host $reportText
          if ($vp.ExitCode -ne 0) {
            Fail-Smoke "Packaged functional verification failed (exit $($vp.ExitCode)): $reportText"
          }
          $reportOneLine = $reportText.Replace('%','%25').Replace("`r",' ').Replace("`n",' || ')
          Write-Host "::notice title=Packaged functional verification::$reportOneLine"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomaPaint-Windows-x64-Human-Test
          path: KomaPaint-Windows-x64-Human-Test.zip
          if-no-files-found: error
          retention-days: 30
