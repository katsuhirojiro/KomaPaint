name: Windows Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Windows x64 (MSVC 2022, Qt 6.8.3)
    runs-on: windows-2022

    env:
      QT_VERSION: 6.8.3
      QT_ARCH: win64_msvc2022_64
      BUILD_TYPE: Release
      BUILD_DIR: ${{ github.workspace }}\build
      OUTPUT_DIR: ${{ github.workspace }}\build\bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up Python (for aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt ${{ env.QT_VERSION }} (${{ env.QT_ARCH }})
        uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}\qt
          set-env: true
          setup-python: false
          # Additional modules required beyond qtbase (which the action always installs):
          # qtdeclarative : Qml, Quick, Quick Controls 2, Quick Layouts
          # qtshadertools : runtime shader compiler required by QtQuick/QtQuickControls2
          # qttools       : windeployqt
          modules: 'qtdeclarative qtshadertools qttools'
          aqtversion: '==3.3.*'
          py7zrversion: '==1.1.*'
          cache: true

      - name: Locate Qt installation
        shell: pwsh
        run: |
          $qtDir = "${{ steps.qt.outputs.qt-root-dir }}"
          $qtBin = Join-Path $qtDir "bin"
          if (!(Test-Path (Join-Path $qtBin "qmake.exe"))) {
            Write-Error "qmake.exe not found at $qtBin -- Qt installation failed."
            exit 1
          }
          Write-Host "Qt root : $qtDir"
          Write-Host "Qt bin  : $qtBin"
          echo "qtDir=$qtDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "qtBin=$qtBin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: qtpaths

      - name: Configure CMake (Ninja, C++20, Release)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="${{ steps.qtpaths.outputs.qtDir }}" `
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ env.OUTPUT_DIR }}" `
            -DKOMAPAINT_BUILD_TESTS=ON `
            -DKOMAPAINT_ENABLE_WARNINGS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "${{ env.OUTPUT_DIR }}\komapaint.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Expected build output not found: $exe"
            exit 1
          }
          Write-Host "Built executable:"
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Run unit tests (CTest)
        shell: pwsh
        run: |
          # The install-qt-action adds Qt to PATH, so test executables can find Qt6*.dll.
          ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt runtime dependencies (windeployqt)
        shell: pwsh
        run: |
          $windeploy = Join-Path "${{ steps.qtpaths.outputs.qtBin }}" "windeployqt.exe"
          if (!(Test-Path $windeploy)) {
            Write-Error "windeployqt.exe not found at $windeploy"
            exit 1
          }
          $exe    = "${{ env.OUTPUT_DIR }}\komapaint.exe"
          $qmlDir = "${{ github.workspace }}\ui"
          & $windeploy --release --no-compiler-runtime --no-system-d3d-compiler `
            --no-opengl-sw --qmldir $qmlDir $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sanity-check deployed tree
        shell: pwsh
        run: |
          $bin = "${{ env.OUTPUT_DIR }}"
          $required = @(
            "$bin\komapaint.exe",
            "$bin\Qt6Core.dll",
            "$bin\Qt6Gui.dll",
            "$bin\Qt6Qml.dll",
            "$bin\Qt6Quick.dll",
            "$bin\Qt6QuickControls2.dll",
            "$bin\Qt6Widgets.dll",
            "$bin\platforms\qwindows.dll"
          )
          foreach ($f in $required) {
            if (!(Test-Path $f)) {
              Write-Error "Missing required deployed file: $f"
              exit 1
            }
          }
          Write-Host "--- Deployed files (top-level):"
          Get-ChildItem $bin -File | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Package into ZIP
        shell: pwsh
        run: |
          $src = "${{ env.OUTPUT_DIR }}"
          $zip = "${{ github.workspace }}\KomaPaint-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) {
            Write-Error "Packaging failed; zip not produced."
            exit 1
          }
          Get-Item $zip | Format-List Name,Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomaPaint-Windows-x64-Qt${{ env.QT_VERSION }}
          path: KomaPaint-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
